<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missed Setups Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <button id="backBtn" class="btn-secondary" style="display: none;">Powrot do miesiecy</button>
            <h1 id="appTitle">Missed Setups Journal</h1>
        </div>
        <div class="header-right" style="display: flex; gap: 12px; align-items: center;">
            <!-- Nawigacja zakładek -->
            <div class="tabs-nav" id="tabsNav" style="display: flex; gap: 6px;">
                <button class="btn-secondary active-tab" id="tabJournalBtn">Missed setups</button>
                <button class="btn-secondary" id="tabFrameworksBtn">Framework's</button>
            </div>
            <div class="stats" id="statsCount">Wybierz miesiac</div>
            <button id="addMonthBtn" class="btn-secondary">+ Dodaj miesiac</button>
            <button id="addFrameworkBtn" class="btn-secondary" style="display: none;">+ Dodaj Framework</button>
        </div>
    </header>

    <!-- WIDOK 1: Kafelki miesiecy (Dziennik) -->
    <div id="monthsView" class="months-grid">
        <!-- Generowane dynamicznie przez JS -->
    </div>

    <!-- WIDOK 2: Panel konkretnego miesiaca (Formularz + Lista) -->
    <div id="monthDetailView" class="grid-layout" style="display: none;">
        <div class="card form-card">
            <form id="setupForm">
                <input type="hidden" id="editingId" value="">
                <div class="form-group">
                    <label for="asset">Instrument / Rynek</label>
                    <input type="text" id="asset" placeholder="np. MNQ / EURUSD / SOL" required>
                </div>

                <div class="form-group">
                    <label>Zrzuty ekranu wykresu (Wcisnij Ctrl + V - dowolna ilosc)</label>
                    <div class="paste-zone" id="pasteZone">
                        Kliknij tutaj, a nastepnie wklej screeny (Ctrl+V)
                    </div>
                    <div id="previewContainer" class="preview-container" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>
                </div>

                <div class="form-group">
                    <label for="notes">Notatki / Refleksja (Co poszlo nie tak?)</label>
                    <textarea id="notes" placeholder="Opisz kontekst rynkowy, poziom..."></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="submitBtn" class="btn-primary" style="flex-grow: 1;">Zapisz w tym miesiacu</button>
                    <button type="button" id="cancelEditBtn" class="btn-secondary" style="display: none;">Anuluj</button>
                </div>
            </form>
        </div>

        <div class="entries-list" id="entriesList">
            <!-- Tutaj wpadaja wpisy z wybranego miesiaca -->
        </div>
    </div>

    <!-- WIDOK 3: Zakładka Framework's -->
    <div id="frameworksView" style="display: none;">
        <div class="grid-layout">
            <div class="card form-card">
                <form id="frameworkForm">
                    <input type="hidden" id="editingFrameworkId" value="">
                    <div class="form-group">
                        <label>Zdjecia Framework (Wcisnij Ctrl + V - dowolna ilosc)</label>
                        <div class="paste-zone" id="fwPasteZone">
                            Kliknij tutaj, a nastepnie wklej screeny (Ctrl+V)
                        </div>
                        <div id="fwPreviewContainer" class="preview-container" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button type="submit" id="fwSubmitBtn" class="btn-primary" style="flex-grow: 1;">Zapisz Framework</button>
                        <button type="button" id="fwCancelEditBtn" class="btn-secondary" style="display: none;">Anuluj</button>
                    </div>
                </form>
            </div>

            <div class="entries-list" id="frameworksList">
                <!-- Tutaj wpadają kafelki frameworków -->
            </div>
        </div>
    </div>
</div>

<!-- Custom Modal do dodawania miesiąca -->
<div class="custom-modal-overlay" id="addMonthModal">
    <div class="custom-modal-card">
        <h3>Dodaj nowy miesiac</h3>
        <p>Wprowadz nazwe nowego okresu (np. Luty 2027):</p>
        <input type="text" id="newMonthInput" placeholder="np. Luty 2027">
        <div class="custom-modal-actions">
            <button type="button" class="btn-secondary" id="cancelMonthBtn">Anuluj</button>
            <button type="button" class="btn-primary" id="confirmMonthBtn">Dodaj</button>
        </div>
    </div>
</div>

<!-- Custom Modal potwierdzenia usunięcia miesiąca -->
<div class="custom-modal-overlay" id="deleteMonthModal">
    <div class="custom-modal-card">
        <h3>Usun miesiac</h3>
        <p id="deleteMonthText">Czy na pewno chcesz usunac ten miesiac wraz ze wszystkimi wpisami?</p>
        <div class="custom-modal-actions">
            <button type="button" class="btn-secondary" id="cancelDeleteMonthBtn">Anuluj</button>
            <button type="button" class="btn-primary" id="confirmDeleteMonthBtn" style="background-color: var(--danger); color: white;">Usun</button>
        </div>
    </div>
</div>

<!-- Modal podgladu zdjecia / galerii -->
<div class="modal" id="imageModal">
    <div class="modal-content" style="position: relative; max-width: 90%; max-height: 90%; display: flex; flex-direction: column; align-items: center;" onclick="event.stopPropagation()">
        <button type="button" id="closeModalBtn" style="position: absolute; top: -35px; right: 0; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">x</button>
        <img id="modalImg" src="" alt="Powiekszenie wykresu" style="max-width: 100%; max-height: 80vh; border-radius: 6px; border: 1px solid var(--border);">
        <div id="modalGalleryNav" style="display: flex; gap: 10px; margin-top: 15px; overflow-x: auto; max-width: 100%; padding: 5px;"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
